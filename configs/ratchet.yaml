# Ratchet configuration for Mosaic MCP server
# Streamlined config: Core workflow only, advanced tools commented out for easy re-enable
# See docs/mosaic/RATCHET_INTEGRATION.md for full documentation

# DESIGN PHILOSOPHY: Context-aware workflows with minimal friction
# - one_time_use: true for state-dependent operations (fresh checks required)
# - one_time_use: false for stable operations (session-level tokens)
# - Tag hygiene before mutation (prevent fragmentation)
# - Retrieval before context expansion (understand before you grow)

# Core ratchet observability settings (event capture and storage)
observability:
  enabled: true # Enable event capture
  storage_type: memory # Storage backend: memory, hexxladb
  retention_days: 0 # 0 = keep all events, >0 = prune events older than N days

rules:
  # ============================================
  # CORE WORKFLOW - Essential for daily use
  # ============================================

  # Level 1: Discovery Tools (No Prerequisites)
  # These tools can be called at any time without prerequisites

  - tool: "mosaic_hexxla_health"
    prerequisite: ""
    expiry: "15m"
    error_message: ""
    one_time_use: false

  # Tag Hygiene - Essential before every put_cell
  # Prevents tag fragmentation and ensures consistent taxonomy
  - tool: "mosaic_hexxla_list_tags"
    prerequisite: ""
    expiry: "10m"
    error_message: ""
    one_time_use: true # Fresh check each time (tag vocab changes)

  - tool: "mosaic_hexxla_tag_counts"
    prerequisite: ""
    expiry: "10m"
    error_message: ""
    one_time_use: false

  # Retrieval Tools - Essential for finding cells
  - tool: "mosaic_hexxla_search_embedding"
    prerequisite: ""
    expiry: "10m"
    error_message: ""
    one_time_use: false

  - tool: "mosaic_hexxla_query_cells"
    prerequisite: ""
    expiry: "10m"
    error_message: ""
    one_time_use: false

  - tool: "mosaic_hexxla_search_cells"
    prerequisite: ""
    expiry: "10m"
    error_message: ""
    one_time_use: false

  # Cell Mutation - Tag Hygiene OR Retrieval
  # put_cell requires either tag hygiene (list_tags/tag_counts) OR retrieval
  # OR logic: any prerequisite satisfies the requirement
  - tool: "mosaic_hexxla_put_cell"
    prerequisite: "mosaic_hexxla_list_tags"
    error_message: "Before saving a cell, review existing tags to prevent fragmentation. Call mosaic_hexxla_list_tags to see available tags, or use a retrieval tool to verify target location."
    one_time_use: false

  - tool: "mosaic_hexxla_put_cell"
    prerequisite: "mosaic_hexxla_tag_counts"
    error_message: "Before saving a cell, review existing tags to prevent fragmentation. Call mosaic_hexxla_tag_counts to see tag usage patterns, or use a retrieval tool to verify target location."
    one_time_use: false

  - tool: "mosaic_hexxla_put_cell"
    prerequisite: "mosaic_hexxla_search_embedding"
    error_message: "Before saving a cell, review existing tags to prevent fragmentation AND verify target location. Call mosaic_hexxla_list_tags to see available tags, AND call a retrieval tool (search_embedding, query_cells, or search_cells) to locate relevant cells."
    one_time_use: false

  - tool: "mosaic_hexxla_put_cell"
    prerequisite: "mosaic_hexxla_query_cells"
    error_message: "Before saving a cell, review existing tags to prevent fragmentation AND verify target location. Call mosaic_hexxla_list_tags to see available tags, AND call a retrieval tool (search_embedding, query_cells, or search_cells) to locate relevant cells."
    one_time_use: false

  - tool: "mosaic_hexxla_put_cell"
    prerequisite: "mosaic_hexxla_search_cells"
    error_message: "Before saving a cell, review existing tags to prevent fragmentation AND verify target location. Call mosaic_hexxla_list_tags to see available tags, AND call a retrieval tool (search_embedding, query_cells, or search_cells) to locate relevant cells."
    one_time_use: false

  # Context Assembly - Requires fresh retrieval
  # load_context_pack requires fresh retrieval to provide seed coordinates
  - tool: "mosaic_hexxla_load_context_pack"
    prerequisite: "mosaic_hexxla_search_embedding"
    error_message: "Before loading context, call a retrieval tool to provide fresh seed coordinates. Use mosaic_hexxla_search_embedding, mosaic_hexxla_query_cells, or mosaic_hexxla_search_cells. Each context pack requires fresh retrieval to ensure relevance."
    one_time_use: true # Fresh retrieval for each pack

  - tool: "mosaic_hexxla_load_context_pack"
    prerequisite: "mosaic_hexxla_query_cells"
    error_message: "Before loading context, call a retrieval tool to provide fresh seed coordinates. Use mosaic_hexxla_search_embedding, mosaic_hexxla_query_cells, or mosaic_hexxla_search_cells. Each context pack requires fresh retrieval to ensure relevance."
    one_time_use: true

  - tool: "mosaic_hexxla_load_context_pack"
    prerequisite: "mosaic_hexxla_search_cells"
    error_message: "Before loading context, call a retrieval tool to provide fresh seed coordinates. Use mosaic_hexxla_search_embedding, mosaic_hexxla_query_cells, or mosaic_hexxla_search_cells. Each context pack requires fresh retrieval to ensure relevance."
    one_time_use: true

  # Delete Operations - Context-aware deletion
  # delete_cell requires retrieval to verify cell exists before deletion
  - tool: "mosaic_hexxla_delete_cell"
    prerequisite: "mosaic_hexxla_search_embedding"
    error_message: "Before deleting, verify the cell exists and understand its context. Call a retrieval tool (search_embedding, query_cells, or search_cells) to locate the cell."
    one_time_use: false

  - tool: "mosaic_hexxla_delete_cell"
    prerequisite: "mosaic_hexxla_query_cells"
    error_message: "Before deleting, verify the cell exists and understand its context. Call a retrieval tool (search_embedding, query_cells, or search_cells) to locate the cell."
    one_time_use: false

  - tool: "mosaic_hexxla_delete_cell"
    prerequisite: "mosaic_hexxla_search_cells"
    error_message: "Before deleting, verify the cell exists and understand its context. Call a retrieval tool (search_embedding, query_cells, or search_cells) to locate the cell."
    one_time_use: false

