# Mosaic MCP server config (version 1). Add top-level sections as features land.
# Reference: docs/mosaic/PERSISTENCE_POLICY.md
#
# From repository root:
#   go run ./cmd/mosaic-mcp -policy configs/config.yaml
#   # or after build:
#   ./mosaic-mcp -policy configs/config.yaml
#   export MOSAIC_POLICY_FILE="$PWD/configs/config.yaml"
#
# Required env for DB: MOSAIC_DB_PATH, etc.

version: 1

# --- retention (put_cell kinds for chat turns vs facts; advisory unless enforcement is true) ---
# capture_mode — pick one:
#   llm_curates          — model chooses what to persist (default when retention omitted); can skip low-value chat.
#   save_all_turns       — both turn kinds in scope; intent is full thread persistence (not curated for value).
#   user_only            — user turns only (assistant_response may be rejected if enforcement: true).
#   assistant_only       — assistant turns only (user_message may be rejected if enforcement: true).
#   none                 — no chat turns (user_message / assistant_response rejected under enforcement: true; fact still ok).
#
# enforcement — optional boolean; default false.
#   false — advisory only; server does not block puts by capture_mode.
#   true  — mosaic_hexxla_put_cell returns an error when kind conflicts with capture_mode.
# Legacy strings "off" / "reject" are still accepted.
#
# notes — optional operator/agent-facing text (included in MCP server instructions and mosaic_hexxla_get_persistence_policy).
# Examples below — match capture_mode; swap templates when you change capture_mode (active block matches built-in defaults: llm_curates).

retention:
  capture_mode: llm_curates
  enforcement: false
  # Example notes — align with capture_mode. Optional templates for other modes (uncomment one `notes:` line and remove the active one).
  # notes: "[save_all_turns] Persist every user_message and assistant_response—full transcript intent, including low-signal and chit-chat. Do not filter turns for importance; this is not LLM curation (use llm_curates for selective persistence). Issue puts for all turns the application sends; fact cells as usual where applicable."
  # notes: "[user_only] Only user turns are in capture scope (assistant_message may fail if enforcement is true). Prioritize what the user stated: goals, constraints, examples, terminology, preferences, and facts they asserted. Encode structured knowledge as fact cells when possible."
  # notes: "[assistant_only] Only assistant turns are in capture scope (user_message may fail if enforcement is true). Keep assistant outputs that should survive the session: definitive answers, step-by-step procedures, recommendations, generated artifacts described in text, and safety or compliance notes worth replaying."
  # notes: "[none] Conversational turn kinds are out of scope under enforcement; fact cells remain OK. Use this for knowledge-only storage: definitions, parameters, canonical statements, and other structured facts—not chat transcripts."
  notes: "[llm_curates] You choose what to persist: durable preferences and constraints; stable facts, definitions, and vocabulary; decisions and commitments; ideas, designs, and hypotheses worth revisiting; risks, open questions, and follow-ups; corrections to earlier stored cells; short summaries when they help future turns. Prefer fact cells for canonical knowledge; use turn kinds when mirroring chat. Skip low-value chit-chat unless the user asks to remember it."

# allow_delete_cell — optional; default false. When false, mosaic_hexxla_delete_cell is rejected.
# Set true for local dev when you need deletes.
allow_delete_cell: false
