# .golangci.yml
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - modernize
    - revive
    - whitespace
    - copyloopvar

  settings:
    depguard:
      rules:
        domain_pure:
          files:
            - "**/internal/core/domain/**.go"
          deny:
            - pkg: "github.com/sploitzberg/mosaic/internal/adapter"
              desc: Dependencies must point toward the core.
            - pkg: "github.com/sploitzberg/mosaic/internal/core/services"
              desc: Dependencies must point toward the core.
            - pkg: "github.com/sploitzberg/mosaic/internal/core/ports"
              desc: Dependencies must point toward the core.

        service_clean:
          files:
            - "**/internal/core/services/**.go"
          deny:
            - pkg: "github.com/sploitzberg/mosaic/internal/adapter"
              desc: Dependencies must point toward the core.
            - pkg: "github.com/sploitzberg/mosaic/internal/config"
              desc: Startup maps settings into application-owned values.
        storage_embedder_boundary:
          files:
            - "**/internal/adapter/secondary/hexxlastore/**.go"
          deny:
            - pkg: "github.com/sploitzberg/mosaic/internal/ollama"
              desc: The application composes embedding and vector search.

        port_clean:
          files:
            - "**/internal/core/ports/**.go"
          deny:
            - pkg: "github.com/sploitzberg/mosaic/internal/adapter"
              desc: Dependencies must point toward the core.
            - pkg: "github.com/sploitzberg/mosaic/internal/core/services"
              desc: Dependencies must point toward the core.

        primary_adapter_clean:
          files:
            - "**/internal/adapter/primary/**.go"
          deny:
            - pkg: "github.com/sploitzberg/mosaic/internal/core/services"
              desc: Dependencies must point toward the core.
            - pkg: "github.com/sploitzberg/mosaic/internal/adapter/secondary"
              desc: Dependencies must point toward the core.

        secondary_adapter_clean:
          files:
            - "**/internal/adapter/secondary/**.go"
          deny:
            - pkg: "github.com/sploitzberg/mosaic/internal/adapter/primary"
              desc: Dependencies must point toward the core.

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

    revive:
      rules:
        - name: error-strings
        - name: error-return
        - name: exported

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sploitzberg/mosaic

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
